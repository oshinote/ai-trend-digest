name: AI trend digest

on:
  schedule:
    # 22:00 UTC = 07:00 JST. GitHub's scheduled cron can run a few minutes
    # late under load; adjust if you need tighter precision.
    - cron: '0 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect from sources
        run: python scripts/collect.py

      - name: Summarize into Japanese (Claude API)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/summarize.py

      - name: Push drafts to Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        run: python scripts/notion_push.py

      - name: Commit updated dedup state
        run: |
          git config user.name "ai-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen_ids.json
          git diff --staged --quiet || git commit -m "chore: update seen ids [skip ci]"
          git push
